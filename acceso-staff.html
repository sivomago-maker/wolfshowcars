<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acceso STAFF | WOLF SHOWCARS</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#08120c;color:#effff3;font-family:system-ui,Segoe UI,sans-serif;display:grid;place-items:center;padding:20px}.card{background:#14231a;border:1px solid #35583f;border-radius:20px;padding:28px;width:min(100%,430px);box-shadow:0 15px 60px #0008}h1{font-size:32px;margin:8px 0 4px}.green{color:#7ce89a}.muted{color:#b9cdbd}label{display:block;margin:20px 0 7px}input{width:100%;background:#09150d;border:1px solid #4c6e55;border-radius:10px;color:white;padding:14px;font-size:20px}button{background:#64d785;color:#06140a;border:0;border-radius:10px;padding:14px 18px;font-weight:800;font-size:16px;width:100%;margin-top:20px;cursor:pointer}button:disabled{opacity:.5}.hide{display:none}#msg{min-height:25px;color:#ffb5b5}.pill{background:#21472c;border-radius:10px;padding:14px;margin-top:20px}a{color:#83efa4}</style></head><body><main class="card"><div class="green"><b>🐺 WOLF SHOWCARS 2027</b></div><h1>ACCESO STAFF</h1><p class="muted">Central de Operaciones · Ingreso del personal autorizado</p><section id="login"><form id="form"><label for="number">Número de staff</label><input id="number" type="number" min="1" max="999" required placeholder="Ej.: 07" autocomplete="username"><label for="pin">PIN personal (6 números)</label><input id="pin" type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="current-password" placeholder="••••••"><button id="enter">INGRESAR</button></form></section><section id="logged" class="hide"><div class="pill"><b class="green" id="welcome"></b><p id="role"></p><p class="muted">Tu sesión está activa. Los módulos de carga e ingreso se irán habilitando según tu función.</p></div><button id="logout">CERRAR SESIÓN</button></section><p id="msg" role="status"></p><small class="muted">No compartas tu PIN. Cada movimiento futuro quedará vinculado a tu identificación.</small></main><script>
const base='https://hbqcxubnlqcojbvwibmv.supabase.co/functions/v1/wolf-staff-login',key='sb_publishable_Lfv2Uf5xLPVQsfy75FTAUQ_x-NWUhB8';const $=id=>document.getElementById(id);const roles={qr:'Control QR',puerta:'Registro de autos',pulseras:'Control de pulseras',stands:'Control de stands',supervisor:'Supervisor'};let token=sessionStorage.getItem('wolf_staff_token');async function call(payload){const r=await fetch(base,{method:'POST',headers:{'Content-Type':'application/json','apikey':key},body:JSON.stringify(payload)});const data=await r.json();if(!r.ok)throw Error(data.error||'Error de conexión');return data}function show(staff){$('login').classList.toggle('hide',!!staff);$('logged').classList.toggle('hide',!staff);if(staff){$('welcome').textContent='STAFF '+String(staff.staff_number).padStart(2,'0')+' · '+staff.full_name;$('role').textContent='Función: '+(roles[staff.role]||staff.role)}}$('form').onsubmit=async e=>{e.preventDefault();$('enter').disabled=true;$('msg').textContent='';try{const r=await call({action:'login',staff_number:Number($('number').value),pin:$('pin').value});token=r.token;sessionStorage.setItem('wolf_staff_token',token);$('pin').value='';show(r.staff)}catch(e){$('msg').textContent=e.message}finally{$('enter').disabled=false}};$('logout').onclick=async()=>{try{if(token)await call({action:'logout',token})}catch(e){}token=null;sessionStorage.removeItem('wolf_staff_token');show(null);$('msg').textContent='Sesión cerrada'};(async()=>{if(token){try{const r=await call({action:'me',token});show(r.staff)}catch(e){token=null;sessionStorage.removeItem('wolf_staff_token');show(null)}}})();</script></body></html>
