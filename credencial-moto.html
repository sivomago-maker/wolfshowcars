<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Credencial moto | WOLF SHOWCARS</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#24452a,#08120c 65%);font:15px/1.6 system-ui;color:#f4fff1;display:grid;place-items:center;padding:18px}.card{width:min(100%,470px);border:1px solid #4e7b4e;border-radius:23px;padding:29px;text-align:center;background:linear-gradient(145deg,#1a2e1e,#101b14)}.tag{color:#a5f35c;font-weight:950;letter-spacing:.12em;font-size:12px}h1{font-size:32px;line-height:1.15;margin:12px 0}#qr{background:white;padding:16px;border-radius:15px;display:inline-block;margin:15px auto}#qr img{display:block}#status{border-radius:10px;background:#253b27;padding:13px;color:#d9efda;font-weight:850}p{color:#bbcebd}a{color:#baff83}.back{display:block;margin-top:25px}</style></head><body><main class="card"><div class="tag">🐺 WOLF SHOWCARS · 2027</div><h1>CREDENCIAL DE MOTO 🏍️</h1><p id="ref">Consultando acreditación…</p><div id="qr" hidden></div><p id="vehicle"></p><div id="status">Verificando…</div><p>27 y 28 de febrero de 2027 · Sociedad Rural Roque Pérez</p><p style="font-size:12px">El QR no habilita el ingreso hasta que se confirme el pago. Mostralo al personal de control.</p><a class="back" href="./index.html">← VOLVER AL EVENTO</a></main><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>const token=new URLSearchParams(location.search).get('t')||'',status=document.getElementById('status');async function run(){if(!/^[0-9a-f-]{36}$/i.test(token)){status.textContent='Credencial inválida';return}try{const r=await fetch('https://hbqcxubnlqcojbvwibmv.supabase.co/functions/v1/wolf-moto-qr',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})}),d=await r.json();if(!r.ok||!d.valid)throw Error(d.error||'Credencial no encontrada');document.getElementById('ref').textContent=d.reference||'Acreditación registrada';document.getElementById('vehicle').textContent=d.vehicle||'Moto acreditada';status.textContent=d.message||'Estado pendiente';if(window.QRCode){document.getElementById('qr').hidden=false;new QRCode(document.getElementById('qr'),{text:token,width:220,height:220})}else status.textContent+=' · No se pudo generar el código QR.'}catch(e){status.textContent=e.message}}run();</script></body></html>
