<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Caja motos | WOLF SHOWCARS</title>
<style>
:root{color-scheme:dark;--g:#a5f35c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1b3622,#08110c 65%);color:#eef8ee;font:15px system-ui,Arial}main{max-width:1150px;margin:auto;padding:25px 16px 80px}h1{font-size:clamp(26px,5vw,40px);margin:10px 0}h1 b,.green{color:var(--g)}.muted{color:#b6c9b8}.card{background:#14231a;border:1px solid #35523b;border-radius:16px;padding:18px;margin:15px 0}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:160px}button,a.btn{background:var(--g);color:#0d170e;border:0;border-radius:9px;padding:12px 16px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}button:disabled{opacity:.5}button.alt,a.alt{background:#263f2c;color:#e3ffe0;border:1px solid #608365}input,select{width:100%;padding:12px;border-radius:9px;background:#09140d;color:#fff;border:1px solid #59775e;font:inherit}label{display:block;margin:8px 0}.status{min-height:22px;color:#f8d78a}table{border-collapse:collapse;width:100%;min-width:850px}td,th{border-bottom:1px solid #3a5140;padding:11px 8px;text-align:left;vertical-align:middle}th{color:var(--g);font-size:12px}.scroll{overflow:auto}.small{font-size:12px}.pill{display:inline-block;border:1px solid #5d855d;border-radius:20px;padding:5px 8px}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{padding:8px;font-size:12px}.hide{display:none!important}
</style>
</head>
<body>
<main>
<a class="btn alt" href="./acceso-staff.html">← CENTRAL STAFF</a>
<p class="green">🐺 WOLF SHOWCARS 2027 · STAFF</p>
<h1>CAJA DE <b>MOTOS</b></h1>
<p class="muted">Pago en puerta: $15.000 por moto, conductor y un acompañante. Acompañantes pagos adicionales: $5.000 cada uno.</p>
<p id="who" class="muted">Verificando sesión STAFF…</p>
<div class="card" id="auth" hidden>
  <p id="authMsg" class="status">Necesitás iniciar sesión STAFF.</p>
  <a class="btn" href="./acceso-staff.html">INGRESAR A CENTRAL STAFF</a>
</div>
<div id="work" hidden>
  <div class="card">
    <label>QR de moto<input id="qr" placeholder="Token o enlace de credencial" autocomplete="off"></label>
    <button id="inspect">CONSULTAR COBRO</button>
    <p id="msg" class="status"></p>
  </div>
  <div class="card hide" id="detail">
    <div id="info"></div>
    <label>Medio de pago
      <select id="method">
        <option value="cash">Efectivo</option>
        <option value="mercadopago_transfer">Transferencia Mercado Pago</option>
      </select>
    </label>
    <button id="pay" disabled>CONFIRMAR COBRO EN PUERTA</button>
  </div>
</div>
</main>
<script>
const BASE='https://hbqcxubnlqcojbvwibmv.supabase.co/functions/v1/';
const KEY='sb_publishable_Lfv2Uf5xLPVQsfy75FTAUQ_x-NWUhB8';
const $=id=>document.getElementById(id);
let token=sessionStorage.getItem('wolf_staff_token')||'';
let last='',busy=false,authorized=false;
const allowedRoles=['staff','supervisor','puerta'];
const money=v=>'$'+Number(v||0).toLocaleString('es-AR');
const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const msg=t=>$('msg').textContent=t;
function eventDay(){
  const day=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Argentina/Buenos_Aires',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
  return day==='2027-02-27'||day==='2027-02-28';
}
async function api(endpoint,payload){
  const res=await fetch(BASE+endpoint,{
    method:'POST',
    headers:{'Content-Type':'application/json',apikey:KEY},
    body:JSON.stringify({token,...payload})
  });
  let data;
  try{data=await res.json()}catch{throw Error('No se pudo conectar con el servidor')}
  if(!res.ok||data.error)throw Error(data.error||'Error del servidor');
  return data;
}
function parse(v){
  v=String(v||'').trim();
  try{if(/^https?:\/\//i.test(v))return new URL(v).searchParams.get('t')||''}catch{}
  return v;
}
async function check(){
  try{
    if(!token)throw Error('Iniciá sesión desde la Central STAFF.');
    const r=await api('wolf-staff-login',{action:'me'});
    const staff=r.staff;
    if(!staff||!allowedRoles.includes(staff.role))throw Error('Tu perfil no tiene permiso para operar la Caja de Motos.');
    authorized=true;
    $('who').textContent='STAFF '+String(staff.staff_number).padStart(2,'0')+' · '+staff.full_name+' · '+(staff.role==='supervisor'?'Supervisor':'Personal operativo');
    $('auth').hidden=true;
    $('work').hidden=false;
    if(!eventDay())msg('MODO PREPARACIÓN: podés consultar credenciales, pero los cobros se habilitan únicamente durante el evento.');
  }catch(e){
    authorized=false;
    $('who').textContent='Acceso no habilitado';
    $('authMsg').textContent=e.message;
    $('auth').hidden=false;
    $('work').hidden=true;
  }
}
async function inspect(){
  if(!authorized||busy)return;
  busy=true;
  $('inspect').disabled=true;
  $('pay').disabled=true;
  $('detail').classList.add('hide');
  last=parse($('qr').value);
  try{
    if(!last)throw Error('Ingresá el QR o token de la moto.');
    const d=await api('wolf-moto-gate',{action:'inspect',qr_token:last});
    $('detail').classList.remove('hide');
    $('info').innerHTML=`<h2>${safe(d.vehicle)}</h2><p>Expositor: ${safe(d.driver)}</p><p>Pago: ${safe(d.payment)} · ${safe(d.choice)}</p><h2>Total en puerta: ${money(d.amount)}</h2>`;
    const pending=d.choice==='door'&&d.payment!=='confirmed';
    $('pay').disabled=!pending||!eventDay();
    msg(d.payment==='confirmed'?'El pago ya está confirmado. No cobrar nuevamente.':!eventDay()?'MODO PREPARACIÓN: el cobro no está habilitado hasta el evento.':'Verificá el dinero recibido antes de confirmar.');
  }catch(e){
    msg(e.message);
    $('pay').disabled=true;
  }finally{
    busy=false;
    $('inspect').disabled=false;
  }
}
$('inspect').onclick=inspect;
$('pay').onclick=async()=>{
  if(!authorized||!eventDay()||busy)return;
  if(!confirm('Confirmá que recibiste el pago. Esta operación quedará registrada.'))return;
  const b=$('pay');
  b.disabled=true;
  try{
    const d=await api('wolf-moto-gate',{action:'moto_payment',qr_token:last,method:$('method').value});
    msg('Cobro registrado: '+money(d.amount));
    await inspect();
  }catch(e){msg(e.message)}
};
check();
</script>
</body>
</html>
