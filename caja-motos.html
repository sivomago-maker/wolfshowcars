<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Caja motos | WOLF SHOWCARS</title><style>:root{color-scheme:dark;--g:#a5f35c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1b3622,#08110c 65%);color:#eef8ee;font:15px system-ui,Arial}main{max-width:1150px;margin:auto;padding:25px 16px 80px}h1{font-size:clamp(26px,5vw,40px);margin:10px 0}h1 b,.green{color:var(--g)}.muted{color:#b6c9b8}.card{background:#14231a;border:1px solid #35523b;border-radius:16px;padding:18px;margin:15px 0}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:160px}button,a.btn{background:var(--g);color:#0d170e;border:0;border-radius:9px;padding:12px 16px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}button:disabled{opacity:.5}button.alt,a.alt{background:#263f2c;color:#e3ffe0;border:1px solid #608365}input,select{width:100%;padding:12px;border-radius:9px;background:#09140d;color:#fff;border:1px solid #59775e;font:inherit}label{display:block;margin:8px 0}.status{min-height:22px;color:#f8d78a}table{border-collapse:collapse;width:100%;min-width:850px}td,th{border-bottom:1px solid #3a5140;padding:11px 8px;text-align:left;vertical-align:middle}th{color:var(--g);font-size:12px}.scroll{overflow:auto}.small{font-size:12px}.pill{display:inline-block;border:1px solid #5d855d;border-radius:20px;padding:5px 8px}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{padding:8px;font-size:12px}.hide{display:none!important}</style></head><body><main><a class="btn alt" href="./central-wolf.html">← CENTRAL WOLF</a><p class="green">🐺 WOLF SHOWCARS 2027 · STAFF</p><h1>CAJA DE <b>MOTOS</b></h1><p class="muted">Pago en puerta: $15.000 por moto, conductor y un acompañante. Acompañantes pagos adicionales: $5.000 cada uno.</p><div class="card"><label>QR de moto<input id="qr" placeholder="Token o enlace de credencial"></label><button id="inspect">CONSULTAR COBRO</button><p id="msg" class="status"></p></div><div class="card hide" id="detail"><div id="info"></div><label>Medio de pago<select id="method"><option value="cash">Efectivo</option><option value="mercadopago_transfer">Transferencia Mercado Pago</option></select></label><button id="pay" disabled>CONFIRMAR COBRO EN PUERTA</button></div><script>const token=sessionStorage.getItem('wolf_staff_token');if(!token){location.href='./acceso-staff.html'}async function api(endpoint,payload){const res=await fetch('https://hbqcxubnlqcojbvwibmv.supabase.co/functions/v1/'+endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,...payload})});let data=await res.json();if(!res.ok||data.error)throw Error(data.error||'Error del servidor');return data}const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=v=>'$'+Number(v||0).toLocaleString('es-AR');const msg=t=>document.getElementById('msg').textContent=t;let last='';const parse=v=>{try{if(v.startsWith('http'))return new URL(v).searchParams.get('t')||''}catch{}return v.trim()};async function inspect(){last=parse(document.getElementById('qr').value);try{const d=await api('wolf-moto-gate',{action:'inspect',qr_token:last});document.getElementById('detail').classList.remove('hide');document.getElementById('info').innerHTML=`<h2>${safe(d.vehicle)}</h2><p>Expositor: ${safe(d.driver)}</p><p>Pago: ${safe(d.payment)} · ${safe(d.choice)}</p><h2>Total en puerta: ${money(d.amount)}</h2>`;document.getElementById('pay').disabled=d.choice!=='door'||d.payment==='confirmed';msg(d.payment==='confirmed'?'El pago ya está confirmado. No cobrar nuevamente.':'Verificá el dinero recibido antes de confirmar.')}catch(e){msg(e.message);document.getElementById('pay').disabled=true}}document.getElementById('inspect').onclick=inspect;document.getElementById('pay').onclick=async()=>{if(!confirm('Confirmá que recibiste el pago. Esta operación quedará registrada.'))return;const b=document.getElementById('pay');b.disabled=true;try{const d=await api('wolf-moto-gate',{action:'moto_payment',qr_token:last,method:document.getElementById('method').value});msg('Cobro registrado: '+money(d.amount));await inspect()}catch(e){msg(e.message)}};</script></main></body></html>
