<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Recuperar credenciales | WOLF SHOWCARS</title><style>:root{color-scheme:dark;font-family:system-ui,Arial}*{box-sizing:border-box}body{margin:0;background:#08120c;color:#f3fff1}main{max-width:850px;margin:auto;padding:25px 15px}h1{font-size:clamp(25px,5vw,39px)}b,.green{color:#a5f35c}.card{background:#14251a;border:1px solid #355c3b;border-radius:16px;padding:20px;margin:17px 0}input,select,button{font:inherit;padding:12px;border-radius:9px}input,select{background:#08140b;color:white;border:1px solid #65816b;width:100%}button{background:#a5f35c;color:#0c160b;border:0;font-weight:800;cursor:pointer}button:disabled{opacity:.5}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.row>*{flex:1;min-width:140px}.item{padding:15px 0;border-bottom:1px solid #36533c;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}.item:last-child{border:0}.muted{color:#bacfba;font-size:13px}a{color:#a5f35c}.status{min-height:25px;color:#ffe39b}#results button{white-space:nowrap}</style></head><body><main><a href="./acceso-staff.html">← ACCESO STAFF</a><p class="green">🐺 WOLF SHOWCARS 2027 · SUPERVISOR</p><h1>RECUPERAR <b>CREDENCIALES QR</b></h1><p>Buscá una acreditación existente y abrí su QR. No se crea un registro nuevo ni se modifica el pago.</p><div class="card"><div class="row"><label>Tipo<select id="type"><option value="moto">Motos</option><option value="car">Autos</option></select></label><label>Buscar por nombre, vehículo o patente<input id="search" placeholder="Ej.: Honda Tornado o Tornado"></label></div><button id="load">BUSCAR ACREDITACIONES</button><p class="status" id="msg" role="status"></p><div id="results"></div></div></main><script>const $=x=>document.getElementById(x),base='https://hbqcxubnlqcojbvwibmv.supabase.co/functions/v1/',token=sessionStorage.getItem('wolf_staff_token'),key='sb_publishable_Lfv2Uf5xLPVQsfy75FTAUQ_x-NWUhB8';let rows=[];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(body){const r=await fetch(base+('wolf-'+$('type').value+'-admin'),{method:'POST',headers:{'Content-Type':'application/json','apikey':key},body:JSON.stringify({token,...body})});const d=await r.json();if(!r.ok||d.error)throw Error(d.error||'Error del servidor');return d}async function load(){if(!token){$('msg').innerHTML='Primero iniciá sesión como supervisor desde <a href="./acceso-staff.html">ACCESO STAFF</a>.';return}try{$('msg').textContent='Cargando acreditaciones...';const d=await api({action:'list'});rows=d.rows||[];render();$('msg').textContent=rows.length+' acreditaciones encontradas. '+(d.truncated?'Listado limitado.':'')}catch(e){$('msg').textContent=e.message}}function render(){const q=$('search').value.trim().toLowerCase();const match=rows.filter(r=>[r.driver_name,r.vehicle_brand,r.vehicle_model,r.vehicle_plate,r.origin_city,[r.vehicle_brand,r.vehicle_model].join(' '),r.public_reference].join(' ').toLowerCase().includes(q)).slice(0,100);$('results').innerHTML=match.map(r=>'<div class="item"><div><strong>'+esc(r.vehicle_brand)+' '+esc(r.vehicle_model)+'</strong><div>'+esc(r.driver_name)+' · '+esc(r.vehicle_plate||'Sin patente')+'</div><div class="muted">Pago: '+esc(r.payment_status)+' · '+esc(r.payment_choice)+'</div></div><button data-id="'+esc(r.id)+'">VER QR</button></div>').join('')||'<p>No se encontraron coincidencias.</p>'} $('load').onclick=load;$('search').oninput=render;$('type').onchange=()=>{rows=[];$('results').innerHTML='';$('msg').textContent='Tocá BUSCAR ACREDITACIONES para cargar esta categoría.'};$('results').onclick=async e=>{const b=e.target.closest('button[data-id]');if(!b)return;const kind=$('type').value;try{b.disabled=true;const r=await api({action:'credential',id:b.dataset.id});const a=document.createElement('a');a.href=r.url;a.target='_blank';a.rel='noopener noreferrer';document.body.append(a);a.click();a.remove();$('msg').textContent='Credencial abierta. Si no aparece, permití las ventanas emergentes.'}catch(err){$('msg').textContent=err.message}finally{b.disabled=false}};load();</script></body></html>
