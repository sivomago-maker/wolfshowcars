<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Control QR motos | WOLF SHOWCARS</title><style>:root{color-scheme:dark;--g:#a5f35c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1b3622,#08110c 65%);color:#eef8ee;font:15px system-ui,Arial}main{max-width:1150px;margin:auto;padding:25px 16px 80px}h1{font-size:clamp(26px,5vw,40px);margin:10px 0}h1 b,.green{color:var(--g)}.muted{color:#b6c9b8}.card{background:#14231a;border:1px solid #35523b;border-radius:16px;padding:18px;margin:15px 0}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:160px}button,a.btn{background:var(--g);color:#0d170e;border:0;border-radius:9px;padding:12px 16px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}button:disabled{opacity:.5}button.alt,a.alt{background:#263f2c;color:#e3ffe0;border:1px solid #608365}input,select{width:100%;padding:12px;border-radius:9px;background:#09140d;color:#fff;border:1px solid #59775e;font:inherit}label{display:block;margin:8px 0}.status{min-height:22px;color:#f8d78a}table{border-collapse:collapse;width:100%;min-width:850px}td,th{border-bottom:1px solid #3a5140;padding:11px 8px;text-align:left;vertical-align:middle}th{color:var(--g);font-size:12px}.scroll{overflow:auto}.small{font-size:12px}.pill{display:inline-block;border:1px solid #5d855d;border-radius:20px;padding:5px 8px}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{padding:8px;font-size:12px}.hide{display:none!important}</style></head><body><main><a class="btn alt" href="./central-wolf.html">← CENTRAL WOLF</a><p class="green">🐺 WOLF SHOWCARS 2027 · STAFF</p><h1>CONTROL QR <b>MOTOS</b></h1><p class="muted">Inspeccioná la credencial antes de registrar el ingreso. Los movimientos reales se habilitan el 27 y 28 de febrero de 2027.</p><div class="card"><label>Código QR de moto<input id="qr" placeholder="Pegá el enlace QR o su token UUID" autocomplete="off"></label><div class="row"><button id="inspect">CONSULTAR MOTO</button><button class="alt" id="enter" disabled>REGISTRAR INGRESO</button></div><p id="msg" class="status"></p></div><div id="detail" class="card hide"></div><script>const token=sessionStorage.getItem('wolf_staff_token');if(!token){location.href='./acceso-staff.html'}async function api(endpoint,payload){const res=await fetch('https://hbqcxubnlqcojbvwibmv.supabase.co/functions/v1/'+endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,...payload})});let data=await res.json();if(!res.ok||data.error)throw Error(data.error||'Error del servidor');return data}const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=v=>'$'+Number(v||0).toLocaleString('es-AR');const msg=t=>document.getElementById('msg').textContent=t;let last='';function parseQR(v){v=v.trim();try{if(v.startsWith('http')){const u=new URL(v);return u.searchParams.get('t')||u.searchParams.get('token')||''}}catch{}return v}async function inspect(){try{last=parseQR(document.getElementById('qr').value);const d=await api('wolf-moto-gate',{action:'inspect',qr_token:last});document.getElementById('detail').classList.remove('hide');document.getElementById('detail').innerHTML=`<h2>${safe(d.vehicle)}</h2><p><b>Expositor:</b> ${safe(d.driver)}</p><p><b>Referencia:</b> ${safe(d.reference)}</p><p><b>Patente:</b> ${safe(d.plate)}</p><p><b>Pago:</b> ${safe(d.payment)} · ${safe(d.choice)}</p><p><b>Ingreso previo:</b> ${d.checked_in?'SÍ':'NO'}</p>`;document.getElementById('enter').disabled=d.payment!=='confirmed';msg(d.payment==='confirmed'?'Pago confirmado. Revisá la identidad antes de ingresar.':'PAGO PENDIENTE: NO PERMITIR EL INGRESO.')}catch(e){document.getElementById('enter').disabled=true;msg(e.message)}}document.getElementById('inspect').onclick=inspect;document.getElementById('enter').onclick=async()=>{if(!confirm('¿Confirmás el ingreso de esta moto?'))return;try{const d=await api('wolf-moto-gate',{action:'checkin',qr_token:last});msg(d.event_type==='reentry'?'REINGRESO REGISTRADO':'INGRESO REGISTRADO');document.getElementById('enter').disabled=true}catch(e){msg(e.message)}};const q=new URLSearchParams(location.search).get('t');if(q){document.getElementById('qr').value=q;inspect()}</script></main></body></html>
