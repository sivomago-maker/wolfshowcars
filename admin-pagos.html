<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Control de señas | WOLF SHOWCARS</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#173118,#080b08 60%);color:#fff;font:15px Arial,sans-serif}main{max-width:1080px;margin:auto;padding:24px 14px}h1{font-size:26px}h1 span,h2{color:#57ff14}.panel{background:#111811;border:1px solid #314331;border-radius:15px;padding:22px;margin:16px 0}.muted{color:#b3c0af;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.item{border:1px solid #354735;background:#0c100c;border-radius:12px;padding:16px}button,.btn{border:0;border-radius:8px;background:#57ff14;color:#091109;padding:12px 14px;font-weight:900;cursor:pointer;text-decoration:none;display:inline-block;margin:5px 5px 5px 0}button:disabled{opacity:.5}.secondary{background:#273327;color:#fff;border:1px solid #496549}input{padding:12px;border:1px solid #456045;border-radius:8px;background:#080c08;color:#fff;width:100%;font-size:15px}a{color:#57ff14}.hidden{display:none!important}.message{padding:12px;background:#192a18;border:1px solid #4e7b49;border-radius:8px;margin:10px 0;white-space:pre-wrap}.pay{border-top:1px solid #3d513d;margin-top:12px;padding-top:12px}.pay a{display:inline-block;margin:10px 0}img{max-width:180px;max-height:110px;object-fit:contain;background:#fff;border-radius:8px;padding:7px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main><a href="./admin-stands.html">← ADMINISTRACIÓN DE STANDS</a><h1>WOLF <span>SHOWCARS</span> · SEÑAS</h1><p class="muted">Control privado de comprobantes y confirmación de transferencias. Verificá el ingreso del dinero antes de aprobar un pago.</p><section id="login" class="panel"><h2>ACCESO ADMINISTRATIVO</h2><form id="form"><label for="email">Correo autorizado</label><input id="email" type="email" required value="sivomago@gmail.com"><button style="margin-top:12px">ENVIAR ENLACE DE ACCESO</button></form></section><section id="admin" class="hidden"><div class="panel"><button id="refresh">ACTUALIZAR SOLICITUDES</button><button class="secondary" id="logout">CERRAR SESIÓN</button><p id="notice" class="muted"></p></div><div id="list" class="grid"></div></section></main><script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2.53.0';const db=createClient('https://hbqcxubnlqcojbvwibmv.supabase.co','sb_publishable_Lfv2Uf5xLPVQsfy75FTAUQ_x-NWUhB8',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const $=x=>document.getElementById(x);let loading=false;const ars=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(n);async function api(body){const{data,error}=await db.functions.invoke('admin-stands-api',{body});if(error)throw error;if(data?.error)throw Error(data.error);return data}function element(tag,txt,cls){const e=document.createElement(tag);if(txt!==undefined)e.textContent=txt;if(cls)e.className=cls;return e}
async function detail(card,a){const d=await api({action:'payment_detail',id:a.id});card.querySelector('.details')?.remove();const wrap=element('div',undefined,'details');if(d.instagram_handle)wrap.append(element('p','Instagram: '+d.instagram_handle));if(d.logo_url){const img=document.createElement('img');img.src=d.logo_url;img.alt='Logo del emprendimiento';wrap.append(img)}if(!d.payments?.length)wrap.append(element('p','Todavía no hay comprobantes.','muted'));for(const p of d.payments||[]){const box=element('div',undefined,'pay');box.append(element('p','Importe declarado: '+ars(p.amount_ars)+' · Estado: '+p.review_status));if(p.transfer_reference)box.append(element('p','Referencia: '+p.transfer_reference));if(p.receipt_url){const link=element('a','VER COMPROBANTE (enlace temporal)');link.href=p.receipt_url;link.target='_blank';link.rel='noopener noreferrer';box.append(link)}if(p.review_status==='pending_review'){for(const [decision,title] of [['confirmed','CONFIRMAR PAGO'],['rejected','RECHAZAR COMPROBANTE']]){const btn=element('button',title,decision==='rejected'?'secondary':'');btn.onclick=async()=>{if(!confirm(decision==='confirmed'?'¿Verificaste que la transferencia ingresó a tu cuenta?':'¿Rechazar este comprobante?'))return;btn.disabled=true;try{await api({action:'review_payment',id:a.id,payment_id:p.id,decision});await load()}catch(e){alert(e.message||'Error al actualizar')}finally{btn.disabled=false}};box.append(btn)}}wrap.append(box)}card.append(wrap)}
async function load(){if(loading)return;loading=true;$('refresh').disabled=true;$('notice').textContent='Cargando solicitudes...';try{const data=await api({action:'list'});$('list').replaceChildren();const apps=(data.applications||[]).filter(a=>a.application_status==='approved');$('notice').textContent=apps.length+' solicitudes aprobadas.';for(const a of apps){const card=element('article',undefined,'item');card.append(element('h2',a.business_name),element('p','Código: '+a.reservation_code),element('p','Responsable: '+a.responsible_name),element('p','WhatsApp: '+a.phone),element('p','Seña: '+ars(a.deposit_amount_ars)),element('p','Estado: '+a.deposit_status));const btn=element('button','VER COMPROBANTES','secondary');btn.onclick=async()=>{btn.disabled=true;try{await detail(card,a)}catch(e){alert(e.message||'No se pudo consultar')}finally{btn.disabled=false}};card.append(btn);$('list').append(card)}if(!apps.length)$('list').append(element('p','Todavía no hay postulaciones aprobadas.','muted'))}catch(e){$('notice').textContent='Error: '+(e.message||'No se pudieron cargar las solicitudes')}finally{loading=false;$('refresh').disabled=false}}
async function check(s){if(!s?.access_token)return;try{const{data,error}=await db.functions.invoke('admin-access-check',{method:'POST'});if(error||!data?.authorized)throw Error('Sin autorización');$('login').classList.add('hidden');$('admin').classList.remove('hidden');await load()}catch(e){$('login').classList.remove('hidden');$('admin').classList.add('hidden')}}$('form').onsubmit=async e=>{e.preventDefault();try{const{error}=await db.auth.signInWithOtp({email:$('email').value.trim(),options:{emailRedirectTo:location.origin+location.pathname,shouldCreateUser:false}});if(error)throw error;alert('Revisá tu correo para acceder.')}catch(e){alert('No se pudo enviar el enlace de acceso.')}};$('refresh').onclick=load;$('logout').onclick=()=>db.auth.signOut();db.auth.onAuthStateChange((event,s)=>{if(event==='SIGNED_OUT'){$('admin').classList.add('hidden');$('login').classList.remove('hidden')}else if(['SIGNED_IN','INITIAL_SESSION'].includes(event)&&s)check(s)});
</script></body></html>
